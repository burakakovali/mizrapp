<style>
:root{
  --bg:#EEF1F2;--surface:#FFFFFF;--ink:#1A2229;--muted:#5B6870;--line:#D3DADE;
  --sel:#1A2229;--selInk:#FFFFFF;
  --root:#D39A22;--third:#2E8C8F;--fifth:#4E6FA8;--seventh:#A3517E;--ext:#6E8A2E;
  --board:#3A2318;--fret:#B9C0C5;--string:#E3DCCB;--bone:#EFE6D2;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]):not([data-theme="sepia"]){--bg:#12171B;--surface:#1A2127;--ink:#E5EAED;--muted:#93A0A8;--line:#2B353C;--sel:#E5EAED;--selInk:#12171B;}
}
:root[data-theme="dark"]{--bg:#12171B;--surface:#1A2127;--ink:#E5EAED;--muted:#93A0A8;--line:#2B353C;--sel:#E5EAED;--selInk:#12171B;}
:root[data-theme="sepia"]{--bg:#EFE4CE;--surface:#F8F0DF;--ink:#3A2C1E;--muted:#7A6650;--line:#D6C3A1;--sel:#3A2C1E;--selInk:#F8F0DF;--root:#B9831A;--third:#2F7A73;--fifth:#4A5F93;--seventh:#94456F;--ext:#647A2A;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--root);outline-offset:2px}

.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.hl{min-width:0}
.topbar{flex-wrap:wrap}
.ticon span{font-size:12.5px}
.tpill.alt{border-color:var(--root)}
.tnote{font-size:13.5px;color:var(--root);margin:0 0 8px}
.tlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}
.tcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;display:flex;flex-direction:column;gap:2px}
.tcard b{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:16px}
.tcard span{font-weight:700;letter-spacing:.06em;color:var(--muted);font-size:13.5px}
.tcard small{font-size:12px;color:var(--muted);line-height:1.35}
.tcard[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.capo{min-width:110px;text-align:center;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:20px}
td.easy{color:var(--third);font-weight:700}
.slots{display:grid;gap:5px;margin-top:4px}
.slot{border:1px solid var(--line);border-radius:7px;background:var(--bg);display:flex;flex-direction:column;align-items:center;padding:6px 0 4px;line-height:1.1}
.slot.bt{border-color:var(--muted)}
.slot b{font-size:24px;min-height:28px;font-family:'Bricolage Grotesque',system-ui,sans-serif}
.slot small{font-size:12px;color:var(--muted)}
.slot.lit{background:var(--sel);color:var(--selInk);border-color:var(--sel)}
.slot.lit small{color:inherit}
.shgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.shcard svg{display:block;margin:4px auto}
.rguide{display:flex;gap:10px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.rguide>b{font-size:13.5px;min-width:78px}
.rguide>div{display:flex;flex-wrap:wrap;gap:4px}
.rguide span{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 7px;font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;line-height:1.1;min-width:30px}
.rguide span small{font-weight:400;color:var(--muted);font-size:10.5px}
.rguide span.on{background:var(--root);border-color:var(--root);color:#2A1C05}
.rguide span.on small{color:#2A1C05}
.shtable{display:flex;flex-direction:column;gap:6px}
.shrow{display:grid;grid-template-columns:62px repeat(3,1fr);gap:4px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:6px}
.shname{display:flex;flex-direction:column;line-height:1.2}
.shname b{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:16px}
.shname small{font-size:10.5px;color:var(--muted)}
.shcell{text-align:center;cursor:pointer;min-width:0}
.shcell svg{max-width:100%;height:auto;display:block;margin:0 auto}
.shcell small{font-size:10.5px;color:var(--muted)}
.empty-c{cursor:default;opacity:.6}
@media (max-width:440px){.ticon span{display:none}.ticon{padding:7px 9px}.topbar{gap:6px}.bword{display:none}.brand{margin-right:0}.topbar{justify-content:flex-start}.tool{padding:7px 11px;font-size:13.5px}}
.finder{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.fboard{flex-shrink:0;margin:0 auto}
.fres{flex:1 1 220px}
.frbig{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:52px;line-height:1}
.topbar{display:flex;align-items:center;gap:8px;margin:-4px 0 12px}
.brand{display:inline-flex;align-items:center;gap:8px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:19px;letter-spacing:-.03em;color:var(--ink);margin-right:auto}
.logo{width:34px;height:34px;flex-shrink:0;display:block}
:root[data-theme="dark"] .logo rect{stroke:#2B353C;stroke-width:3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-theme="sepia"]) .logo rect{stroke:#2B353C;stroke-width:3}}
.dbrand{display:inline-flex;align-items:center;gap:10px}
.dbrand .logo{width:38px;height:38px}
.tool{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-weight:700;font-size:14px}
.tool svg{width:17px;height:17px}
.tool.on{background:var(--sel);color:var(--selInk);border-color:var(--sel)}
@media (max-width:380px){.tool{padding:7px 8px;font-size:13px;gap:4px}.topbar .logo{width:30px;height:30px}.topbar{gap:5px}}
.tool.alt{border-color:var(--root);box-shadow:inset 0 0 0 1px var(--root)}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 6px 6px;text-align:center;flex-shrink:0}
.herod svg{display:block;margin:0 auto}
.heronav{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:var(--muted);margin-top:2px}
.herotab{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;font-size:15px;letter-spacing:.06em;margin-top:2px}
.sym{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:clamp(56px,17vw,84px);line-height:.9;letter-spacing:-.03em;margin:0}
.trname{color:var(--muted);margin:6px 0 2px;font-size:17px}
.formula{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:500;font-size:15px;color:var(--muted)}
.play{border:0;background:var(--sel);color:var(--selInk);border-radius:999px;padding:12px 20px;font-weight:700;display:flex;align-items:center;gap:8px;flex-shrink:0}
.play svg{width:16px;height:16px}

.tones{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin:16px 0 22px}
.tone{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column}
.tn{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;font-size:24px;line-height:1.1}
.ti{font-weight:700;color:var(--c);font-size:14px}
.tname{font-size:12.5px;color:var(--muted);line-height:1.3}

.pick-label{font-size:13.5px;color:var(--muted);margin:0 0 6px}
.roots{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:14px}
.roots button{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 0 5px;display:flex;flex-direction:column;align-items:center;line-height:1.15}
.roots button b{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:19px}
.roots button small{font-size:11px;color:var(--muted)}
.roots button[aria-pressed="true"]{background:var(--sel);color:var(--selInk);border-color:var(--sel)}
.roots button[aria-pressed="true"] small{color:inherit;opacity:.75}
.types{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px}
.types button{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-weight:700;font-size:15px}
.types button[aria-pressed="true"]{background:var(--sel);color:var(--selInk);border-color:var(--sel)}

#tabTop{scroll-margin-top:72px;height:0}
.navlogo .logo{width:36px;height:36px}
.topbar{justify-content:flex-start}
.ticon{margin-left:auto}
.navbar{display:flex;align-items:center;gap:10px;margin:-18px -16px 12px;padding:8px 16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:3;border-bottom:2px solid var(--line)}
.menubtn{display:inline-flex;align-items:center;gap:8px;background:var(--sel);color:var(--selInk);border:0;border-radius:999px;padding:9px 16px 9px 12px;font-weight:700;font-size:15px;flex-shrink:0}
.menubtn svg{width:20px;height:20px}
.navcur{display:flex;flex-direction:column;line-height:1.15;min-width:0;flex:1}
.navcur small{color:var(--muted);font-size:12px}
.navcur .nname{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:21px;letter-spacing:-.035em;line-height:1.05}
.navcur small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navwarn{display:inline-flex;align-items:center;gap:5px;border:0;background:var(--root);color:#2A1C05;border-radius:999px;padding:7px 11px;font-weight:700;font-size:13px;flex-shrink:0;white-space:nowrap}
.navwarn svg{width:17px;height:17px}
.navcur{overflow:hidden}
@media (max-width:440px){.navwarn span{display:none}.navwarn{padding:8px}}
.tbanner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;background:color-mix(in srgb,var(--root) 18%,var(--surface));border:1px solid var(--root);border-radius:10px;padding:10px 12px;margin:0 0 14px;font-size:14.5px}
.tbanner svg{width:20px;height:20px;color:var(--root);flex-shrink:0}
.tbanner span{flex:1 1 200px}
.tbanner button{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13.5px}
.drawer-bg{position:fixed;inset:0;background:rgba(10,14,17,.45);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.drawer{position:fixed;top:0;bottom:0;right:0;width:min(320px,86vw);background:var(--surface);z-index:21;transform:translateX(102%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:-4px 0 24px rgba(0,0,0,.18);padding-top:env(safe-area-inset-top,0px)}
body.dopen .drawer{transform:none}
body.dopen .drawer-bg{opacity:1;pointer-events:auto}
@media (prefers-reduced-motion:reduce){.drawer,.drawer-bg{transition:none}}
.dhead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.dhead b{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:22px}
.dclose{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:none;font-size:22px;line-height:1}
.dbody{overflow-y:auto;padding:8px 8px 24px;flex:1}
.dgroup{border-bottom:1px solid var(--line)}
.dgbtn{width:100%;display:flex;align-items:center;justify-content:space-between;background:none;border:0;padding:14px 10px;font-weight:700;font-size:16px;text-align:left}
.dgbtn small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.dgbtn i{font-style:normal;color:var(--muted);transition:transform .2s;font-size:14px}
.dgroup.open .dgbtn i{transform:rotate(90deg)}
.ditems{display:none;padding:0 0 10px 6px}
.dgroup.open .ditems{display:block}
.ditems button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:10px 12px;font-size:15.5px}
.ditems button[aria-current="page"]{background:var(--sel);color:var(--selInk);font-weight:700}
.rem-bg{position:fixed;inset:0;background:rgba(10,14,17,.5);z-index:30;display:none;align-items:center;justify-content:center;padding:16px}
.rem-bg.on{display:flex}
.rem{background:var(--surface);color:var(--ink);border-radius:14px;max-width:380px;width:100%;padding:18px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.rem h2{font-family:'Bricolage Grotesque',system-ui,sans-serif;margin:0 0 8px;font-size:22px}
.rem p{margin:0 0 12px;font-size:15px;line-height:1.5}
.rem .rbtns{display:flex;flex-direction:column;gap:8px}
.rem .rbtns button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;font-weight:700;font-size:15px;text-align:left}
.rem .rbtns button.prim{background:var(--sel);color:var(--selInk);border-color:var(--sel)}
.rem .rbtns button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.rem .rbtns button[aria-pressed="true"]::after{content:" (seçili)";font-weight:400;color:var(--muted)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--selInk)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:14px}
.chips button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:700}

.stage{display:flex;align-items:center;justify-content:center;gap:6px;margin:10px 0 6px}
.nav{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:26px;line-height:1;display:grid;place-items:center;flex-shrink:0}
.nav:disabled{opacity:.35}
svg text{font-family:'Atkinson Hyperlegible',system-ui,sans-serif}
.count{text-align:center;color:var(--muted);font-size:14px;margin-bottom:10px}
.info{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.info p{margin:0 0 4px}
.info p:last-child{margin:0}
.tabline{display:grid;grid-template-columns:auto repeat(6,1fr);gap:2px 0;text-align:center;margin:10px 0 2px;font-variant-numeric:tabular-nums}
.tabline span{padding:2px 0}
.tabline .h{color:var(--muted);font-size:13px}
.tabline .f{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;font-size:20px}
.tabline .lbl{text-align:left;padding-right:10px;color:var(--muted);font-size:13px}

.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin:14px 0 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:50%;background:var(--c);display:inline-block}

.neck{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:8px;margin:0 -16px;padding:0 16px}
.hint{color:var(--muted);font-size:14.5px;margin:10px 0 0;max-width:62ch}
.caged{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.cg{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 6px 8px;text-align:center}
.cg h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;margin:0;font-size:18px}
.cg p{margin:0 0 6px;font-size:13px;color:var(--muted)}
.cg button.mini{border:1px solid var(--line);background:none;border-radius:999px;padding:3px 12px;font-size:13px;margin-top:4px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:16px;color:var(--muted)}

.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;color:var(--muted);font-weight:400}
tbody tr{cursor:pointer}
tbody tr[aria-current="true"]{background:var(--surface)}
td.s{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;font-size:17px}
@media (prefers-reduced-motion:no-preference){.dot{transition:opacity .15s}}
.sub{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;font-size:26px;margin:4px 0 2px;letter-spacing:-.01em}
.mini-tones{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.mini-tones span{border:1px solid var(--line);border-left:4px solid var(--c);background:var(--surface);border-radius:5px;padding:2px 9px;font-weight:700}
.mini-tones small{color:var(--c);margin-left:5px}
.boxview{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-top:14px}
.boxview .info{flex:1 1 180px}
.link{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-weight:700}
.cof{display:flex;justify-content:center;margin:4px 0 8px}
.cof svg{max-width:100%;height:auto}
.dia{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:6px;margin:10px 0 12px}
.dia button{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.dia button small{color:var(--muted);font-size:12px}
.dia button b{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:18px}
.dia button[aria-pressed="true"]{background:var(--sel);color:var(--selInk);border-color:var(--sel)}
.dia button[aria-pressed="true"] small{color:inherit;opacity:.75}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14.5px}
.tempo{display:flex;align-items:center;gap:12px;margin:4px 0 8px}
.bpmwrap{flex:1;text-align:center}
.bpmnum{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:48px;line-height:1}
.bpmnum small{font-size:15px;font-weight:500;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--root);margin-top:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:16px}
.cardhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cardhead .sub{margin:0}
.beats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.beats span{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;color:var(--muted)}
.beats span.acc{border-color:var(--root)}
.beats span.acc2{border-color:var(--third)}
.beats span.lit{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.beats span.acc.lit{background:var(--root);border-color:var(--root);color:#2A1C05}
.grid-wrap{overflow-x:auto}

function fingering(fr){

  const f0=Math.min(...fretted.map(n=>n.f));

  for(let i=lo;i<=hi;i++){if(fr[i]<f0)return null;}

function tplVoicings(c){
  if(!uniformTuning())return [];
  const set=TPL[c.T.id]||[];const pcs=new Set(c.tones.map(t=>t.pc));const out=[];
  let mi=0;set.forEach(([name,o,pr],pi)=>{const mainIx=name.indexOf('(')<0?mi++:99;
    const ref=o.findIndex(x=>x!==null);const offs=o.filter(x=>x!==null);const minO=Math.min(...offs),maxO=Math.max(...offs);
    let r=posOn(ref,c.rootPc,-minO);

      if(!fr.every((f,i)=>f<0||pcs.has((TUNING[i]+f)%12)))continue;
      if(name.indexOf('(')>=0&&!fr.includes(0))continue;
      const v=pinV(fr);v.tname=name;v.prio=pr!==undefined?pr:(name.indexOf('(')>=0?0.5:(mainIx<2?0:1));v.tier=fr.includes(0)?0:1;out.push(v);

const vCache={};
function voicings(c){
  const key=c.rootPc+'|'+c.T.id;

  const req=new Set(c.tones.filter(t=>!(c.tones.length>=5&&t.cat==='fifth')).map(t=>t.pc));
  const all=new Map();
  for(let b=1;b<=19;b++){
    const opts=TUNING.map(o=>{const r=[-1];if(pcs.has(o%12))r.push(0);for(let f=b;f<=b+3;f++)if(pcs.has((o+f)%12))r.push(f);return r;});
    const cur=[];
    (function rec(s,ph){
      if(s===6){evalV(cur.slice());return;}
      for(const f of opts[s]){
        let np;
        if(f===-1)np=ph===0?0:2;
        else{if(ph===2)continue;np=1;}
        cur[s]=f;rec(s+1,np);

    })(0,0);

    const tm=5-m;
    const played=fr.filter(f=>f>=0).length;
    if(played<(c.T.minPlay||4))return;
    if(c.T.maxPlay&&(played>c.T.maxPlay||k>2))return;
    const fretted=fr.filter(f=>f>0);
    const minF=fretted.length?Math.min(...fretted):0,maxF=fretted.length?Math.max(...fretted):0;
    if(maxF-minF>3)return;

    const have=new Set();fr.forEach((f,i)=>{if(f>=0)have.add((TUNING[i]+f)%12)});
    for(const p of req)if(!have.has(p))return;
    const key=fr.join(',');if(all.has(key))return;
    const fg=fingering(fr);if(!fg)return;
    const rootCount=fr.filter((f,i)=>f>=0&&(TUNING[i]+f)%12===c.rootPc).length;
    const opens=fr.filter(f=>f===0).length;
    const sc=played*2-fretted.length*.4-minF*.12+opens*.4+rootCount*.3-(fg.barre?.8:0)-tm*1.5+(c.T.maxPlay?tm*1.5+played:0)-(maxF-minF)*.3;

  }

  for(const v of all.values()){const g=v.k+'|'+v.minF;if(!best[g]||best[g].sc<v.sc)best[g]=v;}
  const rest=Object.values(best);
  const tv=tplVoicings(c);const tk=new Set(tv.map(v=>v.frets.join(',')));

  others.forEach(v=>{v.tier=v.frets.includes(0)&&v.maxF<=4?2:3;});
  const byPos=(a,b)=>a.tier-b.tier||(a.prio||0)-(b.prio||0)||a.minF-b.minF||a.k-b.k;

}

function cagedShapes(c){

/* Pentatonik kutular: her telde iki ses, kalın telden ince tele */
function boxes(sd){
  const semis=sd.tones.map(t=>t.s%12);
  const pcs=new Set(sd.tones.map(t=>t.pc));
  return semis.map((s,j)=>{
    const startPc=(sd.rootPc+s)%12;
    const f0=((startPc-4)%12+12)%12;
    let p=40+f0;const ps=[];
    while(ps.length<12){if(pcs.has(p%12))ps.push(p);p++;}
    let notes=ps.map((pp,k)=>{const i=Math.floor(k/2);return {i,f:pp-TUNING[i],p:pp};});
    if(notes.some(n=>n.f<0))notes=notes.map(n=>({...n,f:n.f+12,p:n.p+12}));
    const fs=notes.map(n=>n.f);
    return {num:j+1,notes,minF:Math.min(...fs),maxF:Math.max(...fs)};

function pinV(fr){

function wedge(r1,r2,a0,a1){
  const p=(r,a)=>[(170+r*Math.cos(a*Math.PI/180)).toFixed(2),(170+r*Math.sin(a*Math.PI/180)).toFixed(2)];
  const [x1,y1]=p(r2,a0),[x2,y2]=p(r2,a1),[x3,y3]=p(r1,a1),[x4,y4]=p(r1,a0);
  return `M${x1} ${y1}A${r2} ${r2} 0 0 1 ${x2} ${y2}L${x3} ${y3}A${r1} ${r1} 0 0 0 ${x4} ${y4}Z`;
}

function diatonic(){

let ctx;const bufCache={};
function ac(){if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx;}
function pluck(midi,when,gain){
  const c=ac();
  if(!bufCache[midi]){
    const f=440*Math.pow(2,(midi-69)/12),sr=c.sampleRate,len=Math.floor(sr*2.4);
    const buf=c.createBuffer(1,len,sr),d=buf.getChannelData(0);
    const N=Math.max(2,Math.round(sr/f)),ring=new Float32Array(N);
    let prev=0;for(let i=0;i<N;i++){const r=Math.random()*2-1;prev=prev*.5+r*.5;ring[i]=prev;}
    let idx=0;for(let i=0;i<len;i++){const nx=(idx+1)%N;const v=ring[idx];ring[idx]=.996*.5*(ring[idx]+ring[nx]);d[i]=v;idx=nx;}
    bufCache[midi]=buf;
  }
  const src=c.createBufferSource();src.buffer=bufCache[midi];
  const g=c.createGain();g.gain.value=gain===undefined?.32:gain;src.connect(g).connect(c.destination);
  src.start(c.currentTime+(when||0));
  setTimeout(()=>pulse(midi),Math.max(0,(when||0)*1000)+25);
}
function pulse(m){
  document.querySelectorAll(`[data-midi="${m}"]`).forEach(el=>{
    el.classList.remove('pulse');void el.getBoundingClientRect();el.classList.add('pulse');
    el.addEventListener('animationend',()=>el.classList.remove('pulse'),{once:true});
  });
}
function refTone(f,m){
  const c=ac();const t=c.currentTime;const g=c.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(.28,t+.03);g.gain.setValueAtTime(.28,t+2);g.gain.exponentialRampToValueAtTime(.0001,t+2.6);g.connect(c.destination);
  [[1,1],[2,.45],[3,.2],[4,.1]].forEach(([h,a])=>{const o=c.createOscillator();o.type='sine';o.frequency.value=f*h;const og=c.createGain();og.gain.value=a;o.connect(og).connect(g);o.start(t);o.stop(t+2.7);});
  pulse(m);
}
function strum(fr){let k=0;fr.forEach((f,i)=>{if(f>=0){pluck(TUNING[i]+f,k*.045);k++;}});}
function playRun(ps){const up=[...ps].sort((a,b)=>a-b);const seq=up.concat(up.slice(0,-1).reverse());seq.forEach((p,k)=>pluck(p,k*.2));}

function enh(t){
  const a=t.note.a,l=t.note.l;
  const odd=Math.abs(a)>1||(l===2&&a===1)||(l===6&&a===1)||(l===3&&a===-1)||(l===0&&a===-1);
  return odd?` (= ${SIMPLE[t.pc]})`:'';
}

let master,noiseBuf;
function out(){if(!master){master=ctx.createGain();master.gain.value=.9;master.connect(ctx.destination);}return master;}
function noise(){if(!noiseBuf){const len=ctx.sampleRate;noiseBuf=ctx.createBuffer(1,len,ctx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;}return noiseBuf;}
function env(g,t,v,dec){g.gain.setValueAtTime(Math.max(v,.002),t);g.gain.exponentialRampToValueAtTime(.001,t+dec);}
function osc(t,v,type,f0,f1,sweep,dec){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+sweep);env(g,t,v,dec);o.connect(g).connect(out());o.start(t);o.stop(t+dec+.05);}
function noiseHit(t,v,type,freq,dec,q){const s=ctx.createBufferSource();s.buffer=noise();const f=ctx.createBiquadFilter();f.type=type;f.frequency.value=freq;if(q)f.Q.value=q;const g=ctx.createGain();env(g,t,v,dec);s.connect(f).connect(g).connect(out());s.start(t);s.stop(t+dec+.05);}
const SND={
  k:(t,v)=>osc(t,.95*v,'sine',150,45,.12,.42),
  s:(t,v)=>{noiseHit(t,.55*v,'highpass',1200,.18);osc(t,.35*v,'triangle',190,0,0,.1);},
  r:(t,v)=>{noiseHit(t,.3*v,'bandpass',1800,.04,4);osc(t,.25*v,'square',1700,0,0,.03);},
  h:(t,v)=>noiseHit(t,.3*v,'highpass',7500,.05),
  oh:(t,v)=>noiseHit(t,.28*v,'highpass',7000,.32),
  t:(t,v)=>osc(t,.7*v,'sine',210,110,.2,.3),
  e:(t,v)=>noiseHit(t,.16*v,'bandpass',6500,.06,1.5)
};
function click(t,level){
  const f=level===2?1700:level===1?1300:level===-1?850:1050;
  osc(t,level===-1?.2:level===2?.6:.45,'sine',f,0,0,.04);
}
function startRt(kind){ac();stopRt(true);rt.on=kind;rt.step=0;rt.jb=0;st.jbar=0;rt.sbar=0;rt.bt=false;rt.next=ctx.currentTime+.08;rt.timer=setInterval(sched,25);sched();requestAnimationFrame(draw);render();}
function stopRt(silent){clearInterval(rt.timer);rt.timer=null;rt.on=null;rt.queue=[];if(!silent)render();}
function sched(){
  while(rt.next<ctx.currentTime+.12){
    const t=rt.next;
    if(rt.on==='met'){
      const acc=SIGS[st.sig];const sub=st.sig.endsWith('/8')?1:st.sub;const total=acc.length*sub;
      rt.step%=total;
      const beat=Math.floor(rt.step/sub),sb=rt.step%sub;
      click(t,sb===0?acc[beat]:-1);
      if(sb===0)rt.queue.push({t,beat});
      rt.next+=60/st.bpm/sub;rt.step=(rt.step+1)%total;
    }else if(rt.on==='jam'){jamSched(t);
    }else if(rt.on==='strum'){strumSched(t);
    }else{
      const p=PATS[st.pat];const len=Object.values(p.tr)[0].length;
      rt.step%=len;
      for(const [k,pat] of Object.entries(p.tr)){const ch=pat[rt.step];if(ch==='x')SND[k](t,1);else if(ch==='o')SND[k](t,.45);}
      rt.queue.push({t,col:rt.step});
      rt.next+=60/st.bpm/p.spb;rt.step=(rt.step+1)%len;
    }
  }
}
function draw(){
  if(!rt.on)return;

}

  h+=`<h2 class="sub" style="margin-top:22px">Kök teline göre aralık haritası</h2>`;
  h+=`<div class="row"><div class="chips">${[0,1,2].map(i=>`<button data-rstr="${i}" aria-pressed="${k===i}">Kök ${6-i}. telde</button>`).join('')}</div></div>`;
  h+=`<div class="row"><div class="seg" role="group" aria-label="Etiket"><button data-mode="interval" aria-pressed="${st.mode!=='note'}">Aralık</button><button data-mode="note" aria-pressed="${st.mode==='note'}">Nota</button></div><div class="chips"><button data-ihl="all" aria-pressed="${st.ihl==='all'}">Tüm aralıklar</button><button data-ihl="ch" aria-pressed="${st.ihl==='ch'}">Sadece ${c.sym}</button></div></div>`;
  h+=`<div class="neck">${fb({from,to,fw:52,dots,hiStr:k,aria:'Aralık haritası'})}</div>`;
  h+=`<p class="hint">Kök ${nn(root)}, ${6-k}. telin ${r}. perdesinde. Bu kalıp sabittir: kökü hangi perdeye taşırsan taşı, çevresindeki aralıklar aynı yerlerde durur. "Sadece ${c.sym}" seçilince seçili akorun sesleri öne çıkar; akor şeklinin bu haritadan nasıl çıktığını görürsün. Hücrelere dokununca ses çalar.</p>`;
  return h;
}

/* ---------- Klavye haritası derlemesi ---------- */
const CYCLE=[{l:5,a:0},{l:1,a:0},{l:4,a:0},{l:0,a:0},{l:3,a:0},{l:6,a:-1},{l:2,a:-1},{l:5,a:-1},{l:1,a:-1},{l:4,a:-1},{l:6,a:0},{l:2,a:0}];
const TRI={maj:['R','M3','P5'],m:['R','b3','P5'],dim:['R','b3','b5'],aug:['R','M3','s5']};
const TRIN={maj:'Majör',m:'Minör',dim:'Eksik',aug:'Artık'};
const INVN=['Kök','1. çevrim','2. çevrim'];
const INVC=['var(--root)','var(--third)','var(--fifth)'];
const MAP_SECTIONS=[['notes','Notalar'],['ref','Referans perdeler'],['uni','Aynı nota'],['oct','Oktavlar'],['tri','Triadlar'],['shape','Şekil kaydırma'],['prog','I–IV–V'],['quiz','Alıştırma']];
function rootOf(pc){return ROOTS[((pc%12)+12)%12];}
function posOn(i,pc,min){let f=((pc-TUNING[i])%12+12)%12;while(f<(min||0))f+=12;return f;}

function triadShapes(root,q,set){
  const tf=tonesFor(root,TRI[q]);const pcs=tf.tones.map(t=>t.pc);
  const perms=[[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]];const seen=new Set();const out=[];
  for(const p of perms){
    const opts=[0,1,2].map(j=>{const b=((pcs[p[j]]-TUNING[set+j])%12+12)%12;return [b,b+12,b+24].filter(f=>f<=22);});
    for(const a of opts[0])for(const b of opts[1])for(const cc of opts[2]){
      const fr=[a,b,cc];const mx=Math.max(...fr),mn=Math.min(...fr);if(mx-mn>3)continue;
      const key=fr.join(',');if(seen.has(key))continue;seen.add(key);
      out.push({fr,inv:p[0],minF:mn,maxF:mx});
    }
  }
  return {tf,list:out.sort((x,y)=>x.minF-y.minF)};
}

function mapUI(c,only){
  if(only){const sv=st.ms;st.ms=only;let r;try{r=mapUI(c);}finally{st.ms=sv;}return r.replace(/^<div class="chips" style="margin-bottom:14px">.*?<\/div>/,'');}
  let h=`<div class="chips" style="margin-bottom:14px">${MAP_SECTIONS.map(([id,n])=>`<button data-ms="${id}" aria-pressed="${st.ms===id}">${n}</button>`).join('')}</div>`;
  const root=c.root,rpc=c.rootPc;
  const card=(t,body)=>`<section class="card" style="margin-top:0"><h2 class="sub" style="margin:0 0 6px">${t}</h2>${!uniformTuning()&&['ref','uni','oct','shape'].includes(st.ms)?'<p class="tnote">Buradaki açıklamalar standart akora göredir; diyagramlar seçili akorda hesaplanır.</p>':''}${body}</section>`;
  if(st.ms==='notes'){
    const dots=[];
    for(let i=0;i<6;i++)for(let f=0;f<=12;f++){
      const pc=(TUNING[i]+f)%12;const nat=LETTER_PC.indexOf(pc);
      if(nat<0&&st.ntm==='nat')continue;
      const lab=nat>=0?LETTERS[nat]:(st.ntm==='flat'?SIMPLE[pc].replace('C♯','D♭').replace('F♯','G♭'):['C♯','C♯','D♯','D♯','E','F','F♯','F♯','G♯','G♯','A♯','A♯'][pc]);
      dots.push({i,f,lab,col:nat>=0?'var(--ink)':'var(--muted)',op:nat>=0?1:.85,midi:TUNING[i]+f,r:nat>=0?11:10});
    }
    dots.forEach(d=>{if(d.col==='var(--ink)')d.col='#2B3640';});
    h+=card('Teller ve notalar',`<p class="fd">Teller kalından inceye E A D G B E. Akılda kalsın diye: <b>E</b>ski <b>A</b>rabalar <b>D</b>ağ <b>G</b>ibi <b>B</b>üyük <b>E</b>ngeller. 6. ve 1. tel ikisi de E olduğu için notaları birebir aynı dizilir; aslında öğrenilecek beş tel var.</p>
    <div class="row" style="margin-top:10px"><div class="seg"><button data-ntm="nat" aria-pressed="${st.ntm==='nat'}">Doğal</button><button data-ntm="sharp" aria-pressed="${st.ntm==='sharp'}">♯ ile</button><button data-ntm="flat" aria-pressed="${st.ntm==='flat'}">♭ ile</button></div></div>
    <div class="neck">${fb({from:0,to:12,dots})}</div>
    <p class="fd" style="margin-top:8px">Müzik alfabesi yedi harftir: A B C D E F G, sonra başa döner. Harfler arası çoğunlukla iki perdedir (tam ses). İstisna B–C ve E–F: bunlar yan yanadır (yarım ses). Aradaki boşluklar diyez ya da bemolle adlandırılır; C♯ ile D♭ aynı perdedir. 12. perdede her tel kendi açık notasına bir oktav yukarıda döner.</p>`);
  }
  if(st.ms==='ref'){
    const p=st.refp;const dots=[],lines=[];
    if(p===5){for(let i=0;i<6;i++){const f=i===3?4:5;dots.push({i,f,lab:SIMPLE[(TUNING[i]+f)%12],cat:'third',midi:TUNING[i]+f});if(i<5){dots.push({i:i+1,f:0,lab:STR[i+1],cat:'ext',midi:TUNING[i+1]});lines.push([i,f,i+1,0,'var(--third)',true]);}}}
    if(p===7){for(let i=0;i<6;i++){const f=7;dots.push({i,f,lab:SIMPLE[(TUNING[i]+f)%12],cat:'fifth',midi:TUNING[i]+f});}
      for(let i=0;i<5;i++){const f=i===3?8:7;dots.push({i:i+1,f,lab:SIMPLE[(TUNING[i])%12],cat:'seventh',midi:TUNING[i+1]+f});lines.push([i,0,i+1,f,'var(--seventh)',true]);dots.push({i,f:0,lab:STR[i],cat:'ext',midi:TUNING[i]});}}
    if(p===12){for(let i=0;i<6;i++){dots.push({i,f:0,lab:STR[i],cat:'ext',midi:TUNING[i]});dots.push({i,f:12,lab:STR[i],cat:'root',midi:TUNING[i]+12});lines.push([i,0,i,12,'var(--root)',true]);}}
    const txt={5:'Her telin 5. perdesi, bir üstteki ince telin açık notasıdır (gitarı kulaktan akort etmenin mantığı). Tek istisna G teli: B telinin sesi G telinin 4. perdesindedir. 5. perde sütununu kalından inceye A D G C E A diye ezberle.',7:'Her telin 7. perdesi B E A D F♯ B dizisini verir. Bir alt teldeki 7. perde, üst telin açık notasının bir oktav yukarısıdır; G teliyle B teli arasında bu 8 perdedir.',12:'12. perde açık tellerin oktavıdır, bu yüzden çift nokta vardır. 12. perdeden sonra her şey aynı sırayla bir oktav yukarıda tekrar eder.'}[p];
    h+=card('Referans perdeler',`<div class="row"><div class="chips">${[5,7,12].map(x=>`<button data-refp="${x}" aria-pressed="${p===x}">${x}. perde</button>`).join('')}</div></div><div class="neck">${fb({from:0,to:12,dots,lines})}</div><p class="fd" style="margin-top:8px">${txt} Bilinmeyen bir notayı ararken en yakın referans perdeden yukarı ya da aşağı sayarsın.</p>`);
  }
  if(st.ms==='uni'){
    const dots=[],lines=[];
    const PC=['var(--root)','var(--third)','var(--fifth)','var(--seventh)','var(--ext)','#C2603A'];
    const pos=[];for(let i=0;i<6;i++)for(let f=0;f<=22;f++)if((TUNING[i]+f)%12===rpc)pos.push({i,f,p:TUNING[i]+f});
    const pitches=[...new Set(pos.map(x=>x.p))].sort((a,b)=>a-b);
    const colOf=p=>PC[pitches.indexOf(p)%PC.length];
    for(const a of pos)for(const b of pos)if(b.i===a.i+1&&b.p===a.p)lines.push([a.i,a.f,b.i,b.f,colOf(a.p),true]);
    pos.forEach(x=>dots.push({i:x.i,f:x.f,lab:nn(root),col:colOf(x.p),midi:x.p}));
    const legend=pitches.map((p,k)=>`<span style="--c:${colOf(p)}"><i></i>${nn(root)}${Math.floor(p/12)-1}</span>`).join('');
    h+=card('Aynı nota başka telde',`<p class="fd">Bir notanın aynısı (aynı yükseklikte) bir ince telde ${uniformTuning()?'5':'birkaç'} perde geride durur.${uniformTuning()?' G telinden B teline geçerken bu fark 4 perdedir; çünkü B teli G telinin 4. perdesine akort edilir.':''} Aşağıda sapın tamamındaki bütün ${nn(root)} sesleri var: <b>aynı renkteki noktalar aynı yükseklikteki sestir</b> ve kesik çizgiyle birbirine bağlıdır.</p><div class="neck">${fb({from:0,to:22,dots,lines})}</div><div class="legend" style="margin-top:6px">${legend}</div><p class="fd" style="margin-top:8px">Renk numarası oktavı gösterir (örneğin ${nn(root)}3, ${nn(root)}4). B teli kuralı her şekil için geçerli: bir şekli G telinden B teline taşırken B teline düşen notayı bir perde ileri al.</p>`);
  }
  if(st.ms==='oct'){
    const dots=[],lines=[];
    for(let i=0;i<6;i++)for(let f=0;f<=22;f++)if((TUNING[i]+f)%12===rpc)dots.push({i,f,lab:nn(root),cat:'root',midi:TUNING[i]+f});
    if(st.octm==='pairs'){
      [[0,2,'var(--third)'],[1,3,'var(--fifth)'],[2,4,'var(--seventh)'],[3,5,'var(--ext)']].forEach(([a,b,col])=>{
        const d=12-(TUNING[b]-TUNING[a]);if(d<0)return;
        for(let f=0;f+d<=22;f++)if((TUNING[a]+f)%12===rpc)lines.push([a,f,b,f+d,col,false]);
      });
    }else{
      [[0,2,4,'var(--third)'],[1,3,5,'var(--fifth)']].forEach(([a,b,cc,col])=>{
        const d1=12-(TUNING[b]-TUNING[a]),d2=12-(TUNING[cc]-TUNING[b]);if(d1<0||d2<0)return;
        for(let f=0;f+d1+d2<=22;f++)if((TUNING[a]+f)%12===rpc){lines.push([a,f,b,f+d1,col,false]);lines.push([b,f+d1,cc,f+d1+d2,col,false]);}
      });
    }
    h+=card('Oktav şekilleri',`<div class="row"><div class="chips"><button data-octm="pairs" aria-pressed="${st.octm==='pairs'}">İki tel atlayarak</button><button data-octm="three" aria-pressed="${st.octm==='three'}">3 oktav zinciri</button></div></div><div class="neck">${fb({from:0,to:22,dots,lines})}</div>
    <p class="fd" style="margin-top:8px">${st.octm==='pairs'?`Bir teli atlayarak oktav bulma: 6. telden 4. tele ve 5. telden 3. tele <b>2 perde ileri</b>; 4. telden 2. tele ve 3. telden 1. tele <b>3 perde ileri</b> (B teli yine bir perde kaydırır).`:`İki oktav şekli uç uca eklenince aynı sesin üç oktavı çıkar: 6→4→2 telleri (+2, +3 perde) ve 5→3→1 telleri (+2, +3 perde). Tüm ${nn(root)} sesleri sapta bu iki zincirin içinde.`} Gitarı üç tel çifti gibi düşün: 6–5, 4–3, 2–1. Kalın çiftte çaldığın bir kalıp, orta çiftte 2 perde, ince çiftte 3 perde daha ileride bir oktav yukarıda tekrar eder.</p>`);
  }
  if(st.ms==='tri'){
    const q=st.tq||(TRI[c.T.id]?c.T.id:'maj');const set=st.tset;
    const {tf,list}=triadShapes(root,q,set);
    const dots=[],bands=[];
    list.forEach((v,idx)=>{
      bands.push({from:v.minF,to:v.maxF,col:INVC[v.inv],lab:['K','1','2'][v.inv],alt:idx%2===1});
      v.fr.forEach((f,j)=>{const i=set+j;const t=tf.byPc[(TUNING[i]+f)%12];dots.push({i,f,lab:st.mode==='note'?t.nn:t.lab,cat:t.cat,midi:TUNING[i]+f});});
    });
    const sets=[[3,'1-2-3'],[2,'2-3-4'],[1,'3-4-5'],[0,'4-5-6']];
    h+=card('Triadlar ve çevrimler',`<p class="fd">Üç sesli akora triad denir: kök, üçlü ve beşli. Yan yana üç telde, en alttaki sese göre üç şekli vardır: <b>kök durumu</b> (en altta kök), <b>1. çevrim</b> (en altta üçlü) ve <b>2. çevrim</b> (en altta beşli). Bu üç şekil sırayla sap boyunca tekrar eder.</p>
    <div class="row" style="margin-top:10px"><div class="chips">${Object.keys(TRI).map(x=>`<button data-tq="${x}" aria-pressed="${q===x}">${nn(root)} ${TRIN[x].toLowerCase()}</button>`).join('')}</div></div>
    <div class="row"><span class="pick-label" style="margin:0">Teller:</span><div class="chips">${sets.map(([x,n])=>`<button data-tset="${x}" aria-pressed="${set===x}">${n}</button>`).join('')}</div>${seg(false)}</div>
    <div class="mini-tones">${tf.tones.map(t=>`<span style="--c:var(--${t.cat})">${t.nn}<small>${t.lab}</small></span>`).join('')}</div>
    <div class="neck">${fb({from:0,to:22,dots,bands,top:24})}</div>
    <div class="legend" style="margin-top:6px">${INVN.map((n,i)=>`<span style="--c:${INVC[i]}"><i></i>${['K','1','2'][i]}: ${n}</span>`).join('')}</div>
    <p class="fd" style="margin-top:8px">Majörden minöre geçmek için tek ses yeter: üçlüyü yarım ses (bir perde) indir. Eksik triadda beşli de bir perde iner; artık triadda beşli bir perde çıkar ve şekil her 4 perdede aynen tekrar eder.</p>`);
  }
  if(st.ms==='shape'){
    const f=st.fx;
    const mk=(rootPc,q,fr)=>{const r=rootOf(rootPc);const T=TRI[q];return {cc:{root:r,T:{},...tonesFor(r,T),sym:nn(r)+(q==='m'?'m':'')},v:pinV(fr)};};
    const mi=mk(4+f,'m',[-1,-1,-1,f,f,f]),ma=mk(7+f,'maj',[-1,-1,f,f,f,-1]);
    const es=[0,1,3].map(r=>mk(4+r,'maj',[r,r+2,r+2,r+1,r,r]));
    h+=card('Tek parmakla akor',`<p class="fd">İnce üç tel açıkken (G B E) Em çalar. Bu üç teli aynı perdede tek parmakla basıp kaydırırsan her perdede başka bir minör akor elde edersin. 2., 3. ve 4. teller aynı perdede basılınca da majör akor çıkar. Kalan teller susturulur.</p>
    <div class="row" style="margin-top:10px;justify-content:center"><button class="nav" data-fx="-1" aria-label="Bir perde geri">−</button><b style="min-width:90px;text-align:center">${f===0?'Açık teller':f+'. perde'}</b><button class="nav" data-fx="1" aria-label="Bir perde ileri">+</button></div>
    <div class="caged">${[mi,ma].map((x,i)=>`<div class="cg"><h3>${x.cc.sym}</h3><p>${i?'2-3-4. teller':'1-2-3. teller'}</p>${diagram(x.cc,x.v,true)}<div><button class="mini" data-play="${x.v.frets.map((ff,j)=>ff<0?'':TUNING[j]+ff).filter(Boolean).join(',')}">Çal</button></div></div>`).join('')}</div>`)
    +`<div style="height:12px"></div>`+card('Eşik seni takip eder',`<p class="fd">Açık akorlar aslında şekildir. E şeklini bir perde yukarı taşıyıp eşiğin yerine işaret parmağıyla barre yaparsan F, üç perde taşırsan G olur. Bütün CAGED şekilleri böyle çalışır; CAGED sekmesinde her akor için görebilirsin.</p><div class="caged" style="grid-template-columns:repeat(3,1fr)">${es.map(x=>`<div class="cg"><h3>${x.cc.sym}</h3>${diagram(x.cc,x.v,true)}</div>`).join('')}</div>
    <p class="fd" style="margin-top:8px">Her akor şeklinin çevresinde bir gam şekli durur ve şekille birlikte kayar. Pentatonik sekmesindeki kutular bunun karşılığıdır. <button class="link" data-gotab="caged">CAGED'e git</button> <button class="link" data-gotab="gam">Gamlar'a git</button></p>`);
    return h;
  }
  if(st.ms==='prog'){
    const k=st.pk;let r=posOn(k,rpc,0);if(r<3)r+=12;
    const degs=[['I',0,1,'maj'],['ii',2,2,'m'],['iii',4,3,'m'],['IV',5,4,'maj'],['V',7,5,'maj'],['vi',9,6,'m']];
    const dots=[];const lst=[];
    degs.forEach(([rn,sm,d,q],j)=>{
      const pc=(rpc+sm)%12;let best=null;
      for(const i of [k,k+1])for(let f=Math.max(0,r-3);f<=Math.min(22,r+4);f++)if((TUNING[i]+f)%12===pc){const sc=Math.abs(f-r)+(i===k&&j?0.5:0);if(!best||sc<best.sc)best={i,f,sc};}
      const nm=nn(spell(root,d,sm))+(q==='m'?'m':'');lst.push(`${rn}: ${nm}`);
      if(best)dots.push({i:best.i,f:best.f,pill:true,lab:`${rn} ${nm}`,cat:j===0?'root':q==='m'?'seventh':'third',midi:TUNING[best.i]+best.f});
    });
    h+=card('Akor ilerlemesinde kök kalıpları',`<p class="fd">Bir ilerlemedeki akorların kökleri sapta sabit bir kalıp çizer. Kök 6. teldeyken IV aynı perdede 5. telde, V iki perde ileride 5. teldedir. Kök 5. teldeyse aynı kalıp 4. tele kayar. Kalıbı bir kez görünce her tonda aynı yerden çalarsın.</p>
    <div class="row" style="margin-top:10px"><div class="chips">${[0,1].map(i=>`<button data-pk="${i}" aria-pressed="${k===i}">I kökü ${6-i}. telde</button>`).join('')}</div></div>
    <div class="neck">${fb({from:Math.max(0,r-3),to:Math.min(22,r+4),dots,fw:58,hiStr:k})}</div>
    <p class="fd" style="margin-top:8px">${nn(root)} majör tonunda: ${lst.join(', ')}. Mavi tonlu kutular majör, mor tonlular minör akorlar. Kök 6. teldeki akorları E şekliyle, 5. teldekileri A şekliyle çalabilirsin. <button class="link" data-gotab="cof">Beşli çembere git</button></p>`);
  }
  if(st.ms==='quiz'){
    const q=st.qz;const target=CYCLE[q.i%12];const tpc=pcOf(target);
    const dots=[];let txt='';
    if(q.m==='h'){const f=((tpc-TUNING[q.str])%12+12)%12;if(q.show){dots.push({i:q.str,f,lab:nn(target),cat:'root',midi:TUNING[q.str]+f});if(f===0)dots.push({i:q.str,f:12,lab:nn(target),cat:'root',midi:TUNING[q.str]+12});}txt=`${6-q.str}. telde (${STR[q.str]}) bul`;}
    else{if(q.show)for(let i=0;i<6;i++){let f=((tpc-TUNING[i])%12+12)%12;if(f===0)f=12;dots.push({i,f,lab:nn(target),cat:'root',midi:TUNING[i]+f});}txt='6. telden 1. tele her telde bul';}
    h+=card('Nota bulma alıştırması',`<p class="fd">Notalar dörtlüler sırasıyla gelir (A D G C F B♭ E♭ A♭ D♭ G♭ B E), böylece telde sürekli atlarsın. Notayı bulurken adını yüksek sesle söyle. Otomatik modda metronom çalar: 3. vuruşta cevap görünür, 4 vuruş sonra sıradaki nota gelir. Tempo Ritim sekmesindeki tempoyla aynı (${st.bpm} BPM).</p>
    <div class="row" style="margin-top:10px"><div class="seg"><button data-qm="h" aria-pressed="${q.m==='h'}">Tek tel</button><button data-qm="v" aria-pressed="${q.m==='v'}">Tüm teller</button></div></div>
    <div class="quiz"><div class="qnote">${nn(target)}</div><div class="qtxt">${txt}</div></div>
    <div class="neck">${fb({from:0,to:12,dots,hiStr:q.m==='h'?q.str:undefined})}</div>
    <div class="actions" style="justify-content:center"><button class="ghost" id="qShow">${q.show?'Gizle':'Göster'}</button><button class="ghost" id="qNext">Sonraki</button><button class="play" id="qAuto">${q.auto?'Durdur':PLAY_ICON+'Otomatik'}</button></div>`);
  }
  return h;
}

let qzTimer=null,qzBeat=0;
function qzStop(){clearInterval(qzTimer);qzTimer=null;st.qz.auto=false;}
function qzNext(){const q=st.qz;q.i++;q.show=false;if(q.m==='h'&&q.i%12===0)q.str=(q.str+1)%6;}
function qzStart(){
  ac();qzStop();st.qz.auto=true;qzBeat=0;st.qz.show=false;
  const tick=()=>{
    if(st.tab!=='map'||st.ms!=='quiz'){qzStop();return;}
    const b=qzBeat%4;click(ctx.currentTime+.01,b===0?2:0);
    if(b===2){st.qz.show=true;render();}

function romanOf(d,sm,type){

/* ---------- Akort aleti ---------- */
const tu={on:false,stream:null,an:null,buf:null,hist:[],last:0,err:'',cur:null,raf:0};
function yin(buf,sr){
  const W=Math.floor(buf.length/2);const maxT=Math.min(W-1,Math.floor(sr/65)),minT=Math.floor(sr/1100);
  const d=new Float32Array(maxT+2);
  for(let t=1;t<=maxT+1;t++){let s=0;for(let i=0;i<W;i++){const x=buf[i]-buf[i+t];s+=x*x;}d[t]=s;}
  let run=0;d[0]=1;for(let t=1;t<=maxT+1;t++){run+=d[t];d[t]=run?d[t]*t/run:1;}
  let tau=-1;
  for(let t=minT;t<=maxT;t++){if(d[t]<0.12){while(t+1<=maxT&&d[t+1]<d[t])t++;tau=t;break;}}
  if(tau<2)return -1;
  const x0=d[tau-1],x1=d[tau],x2=d[tau+1];const den=2*(2*x1-x2-x0);
  const b=den?tau+(x2-x0)/den:tau;
  return sr/b;
}
function noteInfo(f){
  const m=69+12*Math.log2(f/st.a4);const n=Math.round(m);
  return {f,midi:n,cents:(m-n)*100,name:SIMPLE[((n%12)+12)%12],oct:Math.floor(n/12)-1};
}
async function tuStart(){
  tu.err='';
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw {name:'NoMedia'};
    const c=ac();
    tu.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const srcN=c.createMediaStreamSource(tu.stream);
    tu.an=c.createAnalyser();tu.an.fftSize=4096;srcN.connect(tu.an);
    tu.buf=new Float32Array(tu.an.fftSize);tu.on=true;tu.hist=[];tu.cur=null;
    render();tuLoop();
  }catch(e){
    tu.on=false;
    tu.err=e&&e.name==='NotAllowedError'?'Mikrofon izni verilmedi. Tarayıcı ya da uygulama ayarlarından bu sayfaya mikrofon izni verip tekrar dene.':
      'Bu ortamda mikrofona erişilemedi. Uygulamanın içinde gömülü açılan sayfalar mikrofonu engelleyebilir. Aşağıdaki referans seslerle kulaktan akort edebilirsin; Android sürümünde tuner doğrudan çalışacak.';
    render();
  }
}
function tuStop(){
  tu.on=false;cancelAnimationFrame(tu.raf);
  if(tu.stream)tu.stream.getTracks().forEach(t=>t.stop());tu.stream=null;tu.an=null;
}
function tuLoop(){
  if(!tu.on)return;
  tu.raf=requestAnimationFrame(tuLoop);
  const now=performance.now();if(now-tu.last<50)return;tu.last=now;
  tu.an.getFloatTimeDomainData(tu.buf);
  let rms=0;for(let i=0;i<tu.buf.length;i++)rms+=tu.buf[i]*tu.buf[i];rms=Math.sqrt(rms/tu.buf.length);
  if(rms<0.008){tuShow(null,rms);return;}
  const f=yin(tu.buf,ctx.sampleRate);
  if(f<60||f>1400){tuShow(null,rms);return;}
  tu.hist.push(f);if(tu.hist.length>5)tu.hist.shift();
  const med=[...tu.hist].sort((a,b)=>a-b)[Math.floor(tu.hist.length/2)];
  tuShow(noteInfo(med),rms);
}
function tuShow(n,rms){
  const lvl=document.getElementById('tuLvl');if(lvl)lvl.style.width=Math.min(100,rms*600)+'%';
  if(!n){const nm=document.getElementById('tuName');if(nm&&!tu.cur)nm.textContent='–';return;}
  tu.cur=n;
  const c=Math.max(-50,Math.min(50,n.cents));const ok=Math.abs(n.cents)<=3;
  const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v;};
  set('tuName',n.name);set('tuOct',n.oct);set('tuHz',n.f.toFixed(1)+' Hz');
  set('tuCents',(n.cents>0?'+':'')+n.cents.toFixed(0)+' cent');
  const nd=document.getElementById('tuNeedle');if(nd){nd.setAttribute('transform',`rotate(${c*1.2} 160 150)`);nd.setAttribute('stroke',ok?'var(--third)':Math.abs(n.cents)<15?'var(--root)':'var(--seventh)');}
  const box=document.getElementById('tuBox');if(box)box.classList.toggle('intune',ok);
  set('tuHint',ok?'Akortta':n.cents<0?'Pes: teli sık (sesi yükselt)':'Tiz: teli gevşet (sesi indir)');
  let si=-1,best=99;BASE.forEach((m,i)=>{const dd=Math.abs(n.midi+n.cents/100-m);if(dd<best){best=dd;si=i;}});
  document.querySelectorAll('[data-tstr]').forEach(el=>el.classList.toggle('on',+el.dataset.tstr===si&&best<1.5));
  if(st.tmode==='into'){
    const i12=BASE.findIndex(m=>m+12===n.midi);

    if(el)el.innerHTML=i12>=0?`12. perde, <b>${6-i12}. tel (${STR[i12]})</b>: ${(n.cents>0?'+':'')+n.cents.toFixed(0)} cent <button class="play" data-tsave="${i12}">Entonasyona kaydet</button>`:'Açık telin oktavı (12. perde) algılanmadı. Teli 12. perdede basılı çal.';
  }
}
function gauge(){

  const arc=(a0,a1,r)=>{const p=a=>[160+r*Math.sin(a*Math.PI/180),150-r*Math.cos(a*Math.PI/180)];const [x0,y0]=p(a0),[x1,y1]=p(a1);return `M${x0} ${y0} A${r} ${r} 0 0 1 ${x1} ${y1}`;};
  s+=`<path d="${arc(-60,60,130)}" stroke="var(--line)" stroke-width="14" fill="none" stroke-linecap="round"/>`;

/* ---------- Akor bulucu ---------- */
function identify(fr){
  const ps=[];fr.forEach((f,i)=>{if(f>=0)ps.push(TUNING[i]+f);});
  if(!ps.length)return {ps,res:[]};
  const pcs=[...new Set(ps.map(p=>p%12))];const bass=Math.min(...ps)%12;const res=[];
  for(let r=0;r<12;r++){
    if(!pcs.includes(r))continue;
    TYPES.forEach((T,ti)=>{
      const tp=T.iv.map(k=>(r+I[k].s)%12);const ts=new Set(tp);
      if(!pcs.every(p=>ts.has(p)))return;
      const miss=T.iv.filter(k=>!pcs.includes((r+I[k].s)%12));
      let sc=100-ti*.6;
      if(miss.length){if(!(miss.length===1&&miss[0]==='P5'))return;sc-=25;}
      if(r===bass)sc+=20;
      res.push({r,T,sc,omit5:miss.length>0});
    });
  }
  res.sort((a,b)=>b.sc-a.sc);
  return {ps,pcs,bass,res};
}
function idSym(x,bass){
  const root=ROOTS[x.r];const tf=tonesFor(root,x.T.iv);
  return {tf,sym:nn(root)+x.T.sym+(bass!==x.r&&tf.byPc[bass]?'/'+tf.byPc[bass].nn:''),root};
}
function finderSVG(best){
  const fd=st.fd,fs=st.fs,cw=44,ch=46,L=40,T=58,nF=5;
  const W=L+cw*5+34,H=T+ch*nF+34;
  const tf=best?best.tf:null;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Akor bulma klavyesi">`;
  s+=boardV(L,T,cw,ch,nF,fs,false);
  for(let i=0;i<6;i++)for(let k=0;k<nF;k++){const f=fs+k;s+=`<rect data-fc="${i}|${f}" x="${L+cw*(i-.5)}" y="${T+ch*k}" width="${cw}" height="${ch}" fill="transparent" style="cursor:pointer"/>`;}
  for(let i=0;i<6;i++){
    const f=fd[i],x=L+cw*i,ty=T-26;
    const midi=TUNING[i]+f;const t=f>=0&&tf?tf.byPc[midi%12]:null;
    const lab=f>=0?(st.mode==='note'||!t?SIMPLE[midi%12]:t.lab):'';
    const col=t?`var(--${t.cat})`:'var(--ink)';
    let top='';
    if(f<0)top=`<text x="${x}" y="${ty+6}" text-anchor="middle" font-size="18" fill="var(--muted)">×</text>`;
    else if(f===0)top=`<circle cx="${x}" cy="${ty}" r="11" fill="var(--bg)" stroke="${col}" stroke-width="3"/>`;
    else if(f<fs||f>=fs+nF)top=`<text x="${x}" y="${ty+5}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">${f}</text>`;
    else top=`<circle cx="${x}" cy="${ty}" r="11" fill="none" stroke="var(--line)" stroke-dasharray="2 3"/>`;
    s+=`<g data-ftop="${i}" style="cursor:pointer"><rect x="${x-cw/2}" y="${ty-18}" width="${cw}" height="34" fill="transparent"/>${top}</g>`;
    if(f>=fs&&f<fs+nF){const y=T+ch*(f-fs+.5);s+=`<g data-fc="${i}|${f}" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="15" fill="${t?col:'var(--muted)'}" ${t&&t.cat==='root'?'stroke="var(--bone)" stroke-width="2"':''}/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="${lab.length>2?11:13}" font-weight="700" fill="${t&&t.cat==='root'?'#2A1C05':'#fff'}" pointer-events="none">${lab}</text></g>`;}
    if(f>=0)s+=`<text x="${x}" y="${H-8}" text-anchor="middle" font-size="14" font-weight="700" fill="${col}">${t?t.nn:SIMPLE[midi%12]}</text>`;
  }
  return s+'</svg>';
}

/* ---------- Akort türü ve kapo ---------- */
const OPEN_EASY=new Set(['C','A','G','E','D','Am','Em','Dm','A7','E7','D7','G7','C7','B7','Am7','Em7','Dm7','Cmaj7','Fmaj7','Amaj7','Dmaj7','Asus2','Asus4','Dsus2','Dsus4','Esus4','Cadd9']);
function parseChord(tok){
  const m=tok.trim().match(/^([A-Ga-g])([#♯b♭]?)(.*)$/);if(!m)return null;
  const l=LETTERS.indexOf(m[1].toUpperCase());const a=m[2]==='#'||m[2]==='♯'?1:m[2]?-1:0;
  return {pc:pcOf({l,a}),suf:m[3]};
}
function shapeName(pc,suf,capo){return nn(ROOTS[((pc-capo)%12+12)%12])+suf;}

function capoTable(){
  const toks=(st.capoSong||'A E F#m D').split(/[\s,]+/).filter(Boolean);const ch=toks.map(parseChord);
  if(!ch.length||ch.some(x=>!x))return '<p class="hint">Akorları A, F#m, Bb7 gibi yaz.</p>';
  const rows=[];for(let k=0;k<=7;k++){const sh=ch.map(x=>shapeName(x.pc,x.suf,k));const easy=sh.filter(x=>OPEN_EASY.has(x)).length;rows.push({k,sh,easy});}
  const best=Math.max(...rows.map(r=>r.easy));
  return `<div class="tbl" style="margin-top:10px"><table><thead><tr><th>Kapo</th>${toks.map(t=>`<th>${t}</th>`).join('')}<th></th></tr></thead><tbody>${rows.map(r=>`<tr${r.easy===best?' aria-current="true"':''}><td><b>${r.k||'Yok'}</b></td>${r.sh.map(x=>`<td class="${OPEN_EASY.has(x)?'easy':''}">${x}</td>`).join('')}<td>${r.easy===best?'<span class="bd ok">önerilen</span>':''}</td></tr>`).join('')}</tbody></table></div>`;
}

/* ---------- Arpejler ---------- */
function arpPositions(c){
  const minorish=c.tones.some(t=>t.key==='b3');
  const psd=scaleData(minorish?'minp':'majp',c.root);const pb=boxes(psd);
  return pb.map(box=>{
    const notes=[];
    for(let i=0;i<6;i++)for(let f=Math.max(0,box.minF-1);f<=Math.min(22,box.maxF+1);f++){
      const p=TUNING[i]+f;if(!c.byPc[p%12])continue;
      const core=f>=box.minF&&f<=box.maxF;
      const ix=notes.findIndex(n=>n.p===p);
      if(ix>=0){if(!notes[ix].core&&core)notes.splice(ix,1);else continue;}
      notes.push({i,f,p,core});
    }
    const fs=notes.map(n=>n.f);return {num:box.num,notes,minF:Math.min(...fs),maxF:Math.max(...fs)};
  }).sort((a,b)=>a.minF-b.minF);
}
function arpUI(c){
  const ps=arpPositions(c);window._arps=ps;
  const sel=st.abox||'all';
  let h=`<p class="fd" style="margin:0 0 10px">Arpej, akorun seslerini aynı anda değil tek tek çalmaktır. Burada ${c.sym} akorunun sesleri (${c.tones.map(t=>t.nn).join(', ')}) gam pozisyonlarıyla aynı beş bölgeye ayrılmış durumda. Solo çalarken akor değiştiğinde o akorun arpej seslerine inmek cümleyi akorla birlikte değiştirir.</p>`;
  h+=`<div class="mini-tones">${c.tones.map(t=>`<span style="--c:var(--${t.cat})">${t.nn}<small>${t.lab}</small></span>`).join('')}</div>`;
  h+=`<div class="row">${seg(false)}<div class="chips"><button data-abox="all" aria-pressed="${sel==='all'}">Tümü</button>${[1,2,3,4,5].map(n=>`<button data-abox="${n}" aria-pressed="${sel===String(n)}">${n}</button>`).join('')}</div></div>`;
  const o={nF:22,boxes:boxInstances(ps)};if(sel!=='all')o.sel=+sel;
  h+=`<div class="neck">${neck(c.byPc,o)}</div>`;
  if(sel!=='all'){const b=ps.find(x=>x.num===+sel);if(b)h+=`<div class="boxview">${boxDiagram(c,b)}<div class="info"><p><b>Pozisyon ${b.num}</b></p><p>${b.minF===0?'Açık tellerden':b.minF+'. perdeden'} ${b.maxF}. perdeye kadar.</p><p class="hint">Kökten başlayıp yukarı çık, en üst sesten geri in. Her sesi ayrı vur; sonra aynı pozisyonda pentatonikle karıştır.</p><div class="actions"><button class="ghost" id="arpPlay">Arpeji çal</button></div></div></div>`;}
  else h+=`<div class="actions" style="margin-top:12px"><button class="ghost" id="arpPlay">Arpeji çal</button></div>`;

  return h;

function strumAt(fr,t,dir,gain){
  const off=Math.max(0,t-ctx.currentTime);const idx=fr.map((f,i)=>f>=0?i:-1).filter(i=>i>=0);
  const seq=dir==='D'?idx:idx.slice(-4).reverse();
  seq.forEach((i,k)=>pluck(TUNING[i]+fr[i],off+k*.011,gain));
}

  return chord();
}

  const P=STRUMS[st.pat2];const sl=[...P.p];const n=sl.length;rt.step%=n;

    if(c==='D')strumAt(v.frets,t,'D',beatStart?.24:.17);

  }
  rt.queue.push({t,slot:k});

  h+=`<div class="actions" style="margin-top:6px"><button class="ghost" data-bpm="-5">−5</button><span class="who" style="align-self:center"><b id="bpmVal">${st.bpm}</b> BPM</span><button class="ghost" data-bpm="5">+5</button></div>`;
  h+=`<div class="chips" style="margin-top:10px"><button data-stog="sclick" aria-pressed="${st.sclick}">Metronom tıkı</button><button data-stog="sprog" aria-pressed="${st.sprog}">Eşlik ilerlemesiyle çal</button></div></section>`;
  h+=`<p class="hint">↓ aşağı, ↑ yukarı, × susturulmuş vuruş, B bas tel. Altın kural: el bir sarkaç gibi hiç durmaz; vuruşlarda aşağı, "ve"lerde yukarı gider. Boş kutularda el yine hareket eder ama tellere değmez. Yavaş tempoda başla, kalıp oturunca hızlandır. "Eşlik ilerlemesiyle çal" açıkken akorlar Eşlik sekmesinde seçili ilerlemeye göre ölçü ölçü değişir.</p>`;
  return h;
}


/* ---------- Menü ve akort uyarısı ---------- */
const NAV=[
 {g:'akor',n:'Akorlar',d:'Basış, bulma, şekiller',items:[['voicing','Basışlar'],['finder','Akor bul'],['shapes','Akor haritası'],['caged','CAGED'],['famous','Ünlü akorlar'],['sum','Özet']]},
 {g:'teori',n:'Klavye ve teori',d:'Öğrenme bölümleri',items:[['neck','Sap'],['iv','Aralıklar'],['map','Klavye haritası'],['triad','Triadlar'],['gam','Gamlar'],['arp','Arpejler'],['cof','Beşli çember']]},
 {g:'cal',n:'Çalış',d:'Eşlik, tıngırdatma, ritim',items:[['jam','Eşlik'],['strum','Tıngırdatma'],['ritim','Ritim ve metronom']]},
 {g:'arac',n:'Araçlar ve bakım',d:'Tuner, kapo, gitar ayarı',items:[['tuner','Tuner'],['tun','Akort düzeni ve kapo'],['setup','Gitar ayarı']]}
];
const LOGO_SVG='<svg class="logo" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22.5" fill="#1A2229"/><path d="M22 12Q50 6 78 12Q94 14 88 28Q76 58 58 85Q50 97 42 85Q24 58 12 28Q6 14 22 12Z M60 34a10 10 0 1 0 -20 0a10 10 0 1 0 20 0Z" fill-rule="evenodd" fill="#D39A22" transform="translate(50 50) scale(0.66) translate(-50 -50)"/></svg>';
const MENU_ICON='<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const WARN_ICON='<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.5 18.5 17h-17z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 8v4.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="10" cy="14.6" r="1.1" fill="currentColor"/></svg>';
function navFind(id){for(const g of NAV)for(const [k,n] of g.items)if(k===id)return {g,n};return {g:NAV[0],n:NAV[0].items[0][1]};}
function isAltTuning(){return st.tun!=='std'||st.capo>0;}
function tuningNotes(){const T=TUNINGS.find(t=>t.id===st.tun);return T.m.map(m=>SIMPLE[m%12]).join(' ');}
function shortTuning(){const T=TUNINGS.find(t=>t.id===st.tun);return (st.tun==='std'?'Standart':T.n)+(st.capo?`, kapo ${st.capo}`:'');}
function tuningText(plain){
  const T=TUNINGS.find(t=>t.id===st.tun);
  const a=st.tun==='std'?(plain?'standart (E A D G B E)':'Akort düzeni standart (E A D G B E)'):(plain?`${T.n} (${tuningNotes()})`:`Akort düzenin <b>${T.n}</b> (${tuningNotes()})`);
  const c=st.capo?(plain?`, kapo ${st.capo}. perde`:`, kapo <b>${st.capo}. perdede</b>`):(plain?'':', kapo yok');
  return a+c+'.';
}
function navOpen(){
  const g=navFind(st.tab).g.g;st.gopen=st.gopen||{};st.gopen[g]=true;
  drawerRender();document.body.classList.add('dopen');
  const dr=document.getElementById('drawer');dr.setAttribute('aria-hidden','false');
  const c=dr.querySelector('[aria-current="page"]')||dr.querySelector('button');if(c)c.focus();
}
function navClose(){document.body.classList.remove('dopen');const dr=document.getElementById('drawer');dr.setAttribute('aria-hidden','true');const b=document.querySelector('.menubtn');if(b)b.focus();}
function drawerRender(){
  st.gopen=st.gopen||{};
  const dr=document.getElementById('drawer');
  dr.innerHTML=`<div class="dhead"><span class="dbrand">${LOGO_SVG}<b>mizrapp</b></span><button class="dclose" data-dclose="1" aria-label="Menüyü kapat">×</button></div><div class="dbody">${NAV.map(g=>`<div class="dgroup${st.gopen[g.g]?' open':''}"><button class="dgbtn" data-dg="${g.g}" aria-expanded="${!!st.gopen[g.g]}"><span>${g.n}<small>${g.d}</small></span><i aria-hidden="true">›</i></button><div class="ditems">${g.items.map(([id,n])=>`<button data-go="${id}"${st.tab===id?' aria-current="page"':''}>${n}</button>`).join('')}</div></div>`).join('')}</div>`;
}
function goTab(id){
  st.tab=id;qzStop();if(id!=='tuner'&&tu.on)tuStop();render();
  const t=document.getElementById('tabTop');if(t)t.scrollIntoView({behavior:'smooth',block:'start'});
}
/* Hatırlatma: rem = '3m' | '1h' | 'off' (bu düzen için) */
function remLoad(){try{return JSON.parse(localStorage.getItem('tunRemind')||'{}')||{};}catch(e){return {};}}
function remSave(o){try{localStorage.setItem('tunRemind',JSON.stringify(o));}catch(e){}}
let remLast=0;
function remKey(){return st.tun+'|'+st.capo;}
function remDue(){
  if(!isAltTuning())return false;
  const o=remLoad();if(o.off===remKey())return false;
  const iv=o.every==='1h'?3600000:180000;
  return Date.now()-remLast>=iv;
}
function remShow(){
  const o=remLoad();
  const box=document.getElementById('rem');
  box.innerHTML=`<h2 id="remT">Akort düzenini kontrol et</h2><p>${tuningText(false)} Gitarın bu şekilde akortlu değilse akorlar ve gamlar yanlış görünür.</p>
  <div class="rbtns"><button class="prim" data-rem="ok">Tamam, böyle çalıyorum</button><button data-rem="reset">Standarda dön (E A D G B E, kapo yok)</button><button data-rem="3m"${o.every!=='1h'?' aria-pressed="true"':''}>3 dakikada bir hatırlat</button><button data-rem="1h"${o.every==='1h'?' aria-pressed="true"':''}>Saatte bir hatırlat</button><button data-rem="off">Bu düzen için bir daha hatırlatma</button></div>`;
  document.getElementById('remBg').classList.add('on');remLast=Date.now();
  const p=box.querySelector('.prim');if(p)p.focus();
}
function remHide(){document.getElementById('remBg').classList.remove('on');}
function resetTuning(){st.tun='std';st.capo=0;applyTuning();}
document.getElementById('drawer').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.dclose){navClose();return;}
  if(d.dg){st.gopen=st.gopen||{};st.gopen[d.dg]=!st.gopen[d.dg];drawerRender();const nb=document.querySelector(`[data-dg="${d.dg}"]`);if(nb)nb.focus();return;}
  if(d.go){navClose();goTab(d.go);}
});
document.getElementById('drawerBg').addEventListener('click',navClose);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.body.classList.contains('dopen'))navClose();else if(document.getElementById('remBg').classList.contains('on'))remHide();}});
document.getElementById('rem').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const r=b.dataset.rem;const o=remLoad();
  if(r==='3m'||r==='1h'){o.every=r;if(o.off===remKey())delete o.off;remSave(o);}
  else if(r==='off'){o.off=remKey();remSave(o);}
  else if(r==='reset'){resetTuning();}
  remHide();render();
});
setInterval(()=>{if(remDue()&&!document.getElementById('remBg').classList.contains('on')&&!document.hidden)remShow();},15000);

function playCurrent(){const c=chord();const vs=voicings(c);if(vs[0])strum(vs[0].frets);}

document.getElementById('app').addEventListener('click',e=>{
  if(e.target.closest('input,label'))return;
  let b=e.target.closest('[data-midi]');const pb=e.target.closest('.shcell[data-play]');if(pb&&!b)b=pb;if(!b)b=e.target.closest('button,[data-box],[data-key],[data-fc],[data-ftop],tr[data-row]');if(!b)return;
  const d=b.dataset;
  if(d.root!==undefined){st.root=ROOTS[+d.root];st.vi=0;}
  else if(d.type){st.type=d.type;st.vi=0;st.rs='all';}
  else if(d.tab){st.tab=d.tab;if(d.tab!=='map')qzStop();if(d.tab!=='tuner'&&tu.on)tuStop();}
  else if(d.mode){st.mode=d.mode;}
  else if(d.rs){st.rs=d.rs;st.vi=0;}
  else if(d.midi){pluck(+d.midi,0);return;}
  else if(d.box){st.box=st.box===d.box&&d.box!=='off'&&d.box!=='all'?'all':d.box;}
  else if(d.scale){st.scale=d.scale;}
  else if(d.key){
    const [kind,i]=d.key.split('|');const n=kind==='maj'?MAJ[+i]:MIN[+i];
    st.key={...n,minor:kind==='min'};st.root={l:n.l,a:n.a};st.type=kind==='maj'?'maj':'m';st.vi=0;st.rs='all';
    render();playCurrent();return;
  }
  else if(d.dia!==undefined){const x=window._dia[+d.dia];st.root=x.note;st.type=x.type;st.vi=0;st.rs='all';render();playCurrent();return;}
  else if(d.row){st.type=d.row;st.vi=0;st.rs='all';st.tab='voicing';}
  else if(d.cplay!==undefined){strum(window._shapes[+d.cplay].frets);return;}
  else if(d.ivs!==undefined){const s=+d.ivs;const rm=48+pcOf(st.root);pluck(rm,0);pluck(rm+s,.55);pluck(rm,1.15);pluck(rm+s,1.15);return;}
  else if(d.rstr!==undefined){st.rstr=+d.rstr;}
  else if(d.ihl){st.ihl=d.ihl;}
  else if(d.ms){st.ms=d.ms;if(d.ms!=='quiz')qzStop();}
  else if(d.ntm){st.ntm=d.ntm;}
  else if(d.refp){st.refp=+d.refp;}
  else if(d.tq){st.tq=d.tq;}
  else if(d.tset!==undefined){st.tset=+d.tset;}
  else if(d.fx){st.fx=Math.max(0,Math.min(12,st.fx+(+d.fx)));}
  else if(d.pk!==undefined){st.pk=+d.pk;}
  else if(d.octm){st.octm=d.octm;}
  else if(d.qm){st.qz.m=d.qm;st.qz.show=false;}
  else if(d.play){d.play.split(',').forEach((m,k)=>pluck(+m,k*.06));return;}
  else if(d.gotab){st.tab=d.gotab;if(d.gotab!=='tuner'&&tu.on)tuStop();window.scrollTo(0,0);}
  else if(b.id==='qShow'){st.qz.show=!st.qz.show;}
  else if(b.id==='qNext'){qzNext();}
  else if(b.id==='qAuto'){if(st.qz.auto)qzStop();else{qzStart();return;}}
  else if(d.fplay!==undefined){strum(FAMOUS[+d.fplay].fr);return;}
  else if(d.fsel!==undefined){
    const F=FAMOUS[+d.fsel];st.root={...F.root};st.type=F.type;st.rs='all';st.tab='voicing';
    const list=voicings(chord());const key=F.fr.join(',');
    let idx=list.findIndex(x=>x.frets.join(',')===key);
    if(idx<0){list.unshift(pinV(F.fr));idx=0;}
    st.vi=idx;window.scrollTo(0,0);
  }
  else if(d.jam!==undefined){st.jam=+d.jam;st.jscale=JAM[st.jam].sc;st.jbar=0;rt.step=0;rt.jb=0;}
  else if(d.jscale){st.jscale=d.jscale;}
  else if(d.jtog){st[d.jtog]=!st[d.jtog];}
  else if(d.jbpm){setBpm(JAM[st.jam].bpm);return;}
  else if(b.id==='jamBtn'){if(rt.on==='jam')stopRt();else startRt('jam');return;}
  else if(d.tmode){st.tmode=d.tmode;}
  else if(d.a4){st.a4=Math.max(430,Math.min(450,st.a4+(+d.a4)));const el=document.getElementById('tuA4');if(el)el.textContent=st.a4;return;}
  else if(d.tsave!==undefined&&tu.cur){const i=+d.tsave;st.su['in_'+i]=tu.cur.cents.toFixed(1);saveSu();b.textContent='Kaydedildi';return;}
  else if(d.tref!==undefined){const m=BASE[+d.tref];const f=440*Math.pow(2,(m-69)/12)*st.a4/440;refTone(f,m);return;}
  else if(b.id==='tuBtn'){if(tu.on){tuStop();}else{tuStart();return;}}
  else if(d.ss){st.ss=d.ss;}
  else if(d.rad){st.rad=d.rad;}
  else if(d.scl){st.scl=+d.scl;}
  else if(d.put){const [k,t]=d.put.split('|');st.pu[k]=t;}
  else if(b.id==='logSave'){const log=loadLog();const n=(document.getElementById('su-note')||{}).value||'';const dt=new Date();log.push({d:dt.toLocaleDateString('tr-TR'),v:{...st.su},n});saveLog(log.slice(-30));}
  else if(b.id==='logClear'){saveLog([]);}
  else if(d.quick){goTab(d.quick);return;}
  else if(d.drawer){navOpen();return;}
  else if(d.resettun){resetTuning();}
  else if(d.fc){const [i,f]=d.fc.split('|').map(Number);st.fd[i]=st.fd[i]===f?-1:f;if(st.fd[i]>=0)pluck(TUNING[i]+f,0);}
  else if(d.ftop!==undefined){const i=+d.ftop;const f=st.fd[i];st.fd[i]=f>0?-1:f===-1?0:-1;if(st.fd[i]===0)pluck(TUNING[i],0);}
  else if(d.fs){st.fs=Math.max(1,Math.min(18,st.fs+(+d.fs)));}
  else if(b.id==='fClear'){st.fd=[-1,-1,-1,-1,-1,-1];}
  else if(b.id==='fPlay'){strum(st.fd);return;}
  else if(b.id==='fSel'){const id=identify(st.fd);const x=id.res[0];if(x){st.root={...ROOTS[x.r]};st.type=x.T.id;st.rs='all';st.tab='voicing';const list=voicings(chord());const key=st.fd.join(',');let ix=list.findIndex(v=>v.frets.join(',')===key);if(ix<0&&x.r===id.bass){list.unshift(pinV([...st.fd]));ix=0;}st.vi=Math.max(0,ix);window.scrollTo(0,0);}}
  else if(d.themeNext){const i=THEMES.findIndex(x=>x[0]===st.theme);st.theme=THEMES[(i+1)%THEMES.length][0];applyTheme();}
  else if(d.shm){st.shm=d.shm;}
  else if(d.tun){st.tun=d.tun;applyTuning();remLast=Date.now();}
  else if(d.capo){st.capo=Math.max(0,Math.min(9,st.capo+(+d.capo)));applyTuning();remLast=Date.now();}
  else if(d.remset){const o=remLoad();if(d.remset==='off')o.off=remKey();else{o.every=d.remset;if(o.off===remKey())delete o.off;}remSave(o);}
  else if(d.abox){st.abox=d.abox;}
  else if(b.id==='arpPlay'){const ps=window._arps||[];const b0=st.abox&&st.abox!=='all'?ps.find(x=>x.num===+st.abox):ps.find(x=>x.minF<=5)||ps[0];if(b0)playRun(b0.notes.map(n=>n.p));return;}
  else if(d.pat2!==undefined){st.pat2=+d.pat2;rt.step=0;}
  else if(d.stog){st[d.stog]=!st[d.stog];}
  else if(b.id==='strumBtn'){if(rt.on==='strum')stopRt();else startRt('strum');return;}
  else if(d.vnav){st.vi=Math.max(0,st.vi+(+d.vnav));}
  else if(d.bpm){setBpm(st.bpm+(+d.bpm));return;}
  else if(d.sig){st.sig=d.sig;rt.step=0;}
  else if(d.sub){st.sub=+d.sub;rt.step=0;}
  else if(d.pat!==undefined){st.pat=+d.pat;rt.step=0;}
  else if(b.id==='metBtn'){if(rt.on==='met')stopRt();else startRt('met');return;}
  else if(b.id==='drumBtn'){if(rt.on==='drum')stopRt();else startRt('drum');return;}
  else if(b.id==='stopRt'){stopRt();return;}
  else if(b.id==='tap'){
    const now=performance.now();if(rt.taps.length&&now-rt.taps[rt.taps.length-1]>2000)rt.taps=[];
    rt.taps.push(now);rt.taps=rt.taps.slice(-5);
    if(rt.taps.length>=2){const iv=(rt.taps[rt.taps.length-1]-rt.taps[0])/(rt.taps.length-1);setBpm(60000/iv);}
    return;
  }
  else if(b.id==='prev'){st.vi=Math.max(0,st.vi-1);}
  else if(b.id==='next'){st.vi++;}
  else if(b.id==='playBtn'){if(window._v)strum(window._v.frets);return;}
  else if(b.id==='boxPlay'){const bx=window._boxes.find(x=>x.num===+st.box);playRun(bx.notes.map(n=>n.p));return;}
  else if(b.id==='scalePlay'){const bx=window._boxes.find(x=>x.num===1);playRun(bx.notes.map(n=>n.p));return;}
  else if(b.id==='relScale'){const R=SCALES[st.scale].rel;st.root=spell(st.root,R[1],R[2]);st.scale=R[0];}
  else if(b.id==='keyPenta'){st.root={l:st.key.l,a:st.key.a};st.scale=st.key.minor?'minp':'majp';st.tab='gam';st.box='all';}
  else return;
  render();
});
applyTuning();
applyTheme();
render();
if(isAltTuning()&&remLoad().off!==remKey())setTimeout(remShow,600);
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script>
